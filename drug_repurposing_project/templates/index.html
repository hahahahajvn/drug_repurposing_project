<!DOCTYPE html>
<html>
<head>
    <title>药物重定位预测平台</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hero-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 60px 0;
        }
        .prediction-result {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">药物重定位平台</a>
        </div>
    </nav>

    <!-- 主内容 -->
    <div class="hero-section">
        <div class="container">
            <h1 class="display-4">AI药物重定位预测</h1>
            <p class="lead">基于机器学习的药物新适应症发现平台</p>
        </div>
    </div>

    <div class="container mt-5">
        <!-- 预测表单 -->
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>药物-疾病关联预测</h5>
                    </div>
                    <div class="card-body">
                        <form id="predictionForm">
                            <div class="mb-3">
                                <label for="drugName" class="form-label">药物名称</label>
                                <input type="text" class="form-control" id="drugName" placeholder="例如：Metformin" required>
                            </div>
                            <div class="mb-3">
                                <label for="diseaseName" class="form-label">疾病名称</label>
                                <input type="text" class="form-control" id="diseaseName" placeholder="例如：Diabetes" required>
                            </div>
                            <button type="submit" class="btn btn-primary">预测关联概率</button>
                        </form>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>预测结果</h5>
                    </div>
                    <div class="card-body">
                        <div id="predictionResult" class="prediction-result" style="display: none;">
                            <h6>预测结果</h6>
                            <p><strong>药物：</strong><span id="resultDrug"></span></p>
                            <p><strong>疾病：</strong><span id="resultDisease"></span></p>
                            <p><strong>关联概率：</strong><span id="resultProbability"></span></p>
                            <p><strong>预测结论：</strong><span id="resultConclusion"></span></p>
                        </div>
                        <div id="loading" style="display: none;">
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">加载中...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 数据展示 -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5>可用化合物列表</h5>
                    </div>
                    <div class="card-body">
                        <table class="table table-striped" id="compoundsTable">
                            <thead>
                                <tr>
                                    <th>ChEMBL ID</th>
                                    <th>药物名称</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- 动态加载 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 预测表单提交
        document.getElementById('predictionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const drugName = document.getElementById('drugName').value;
            const diseaseName = document.getElementById('diseaseName').value;
            
            // 显示加载中
            document.getElementById('loading').style.display = 'block';
            document.getElementById('predictionResult').style.display = 'none';
            
            // 发送预测请求
            fetch('/predict', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    drug_name: drugName,
                    disease_name: diseaseName
                })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                
                if (data.success) {
                    document.getElementById('resultDrug').textContent = data.drug_name;
                    document.getElementById('resultDisease').textContent = data.disease_name;
                    document.getElementById('resultProbability').textContent = data.probability;
                    document.getElementById('resultConclusion').textContent = data.prediction;
                    document.getElementById('predictionResult').style.display = 'block';
                } else {
                    alert('预测失败: ' + data.error);
                }
            });
        });

        // 加载化合物列表
        fetch('/api/compounds')
            .then(response => response.json())
            .then(data => {
                const tbody = document.querySelector('#compoundsTable tbody');
                data.forEach(compound => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${compound.chembl_id}</td>
                        <td>${compound.pref_name}</td>
                    `;
                    tbody.appendChild(row);
                });
            });
    </script>
</body>
</html>
